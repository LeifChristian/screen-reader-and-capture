<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Screen Narrator Setup</title>
    <link rel="stylesheet" href="static/setup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Screen Narrator Setup</h1>
      <p>Enter your OpenAI API key to start the AI-powered screen narrator.</p>

      <label for="apiKey">OpenAI API Key</label>
      <input
        type="password"
        id="apiKey"
        placeholder="sk-..."
        autocomplete="off"
      />
      <div class="hint">Your key is stored locally in .runtime-config.json</div>

      <button id="startBtn" onclick="startApp()">Start Screen Narrator</button>
      <div class="error" id="errorMessage"></div>
    </div>

    <script src="static/setup.js"></script>
  </body>
</html>
